name: Verify Cloudflare access

# Manual, read-only verification of GitHub's deployment credential.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify token and deployment resource access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '')
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID', '')
          if not token or not account:
              sys.exit('Missing required GitHub Actions secret.')

          def check(path, label):
              request = urllib.request.Request(
                  'https://api.cloudflare.com/client/v4/' + path,
                  headers={'Authorization': 'Bearer ' + token},
                  method='GET',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  sys.exit(label + ': failed (HTTP ' + str(error.code) + ').')
              except (urllib.error.URLError, TimeoutError, ValueError):
                  sys.exit(label + ': request failed.')
              if not payload.get('success'):
                  sys.exit(label + ': Cloudflare rejected the request.')
              return payload.get('result')

          result = check('user/tokens/verify', 'Token validation')
          if not isinstance(result, dict) or result.get('status') != 'active':
              sys.exit('Token is not active.')
          print('PASS: GitHub deployment token is active.')
          result = check('accounts/' + account + '/pages/projects/cloudmeet', 'Pages access')
          if not isinstance(result, dict) or result.get('name') != 'cloudmeet':
              sys.exit('Unexpected Pages project.')
          print('PASS: Token can read the CloudMeet Pages project.')
          check('accounts/' + account + '/workers/scripts/cloudmeet-cron/settings', 'Cron worker access')
          print('PASS: Token can read the CloudMeet cron worker settings.')
          print('Read-only verification complete. No deployment or settings changed.')
          PY
