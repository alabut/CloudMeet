<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!--
			Note: there is deliberately NO document-wide `color-scheme` meta here.
			Declaring `dark light` globally makes the browser render EVERY form
			control with dark-scheme (light) text, including on the vanilla white
			dashboard, where @tailwindcss/forms paints the backgrounds white --
			producing white-on-white invisible inputs. The public flow opts in
			instead via `color-scheme` on .public-flow in app.css.
		-->
		%sveltekit.head%
	</head>
	<!--
		Note: background/font are intentionally NOT set here on <body>. This single
		<body> is shared by every route including the host dashboard (out of scope
		for this restyle), and font-family in particular cascades to any descendant
		that doesn't set its own -- the dashboard has plenty of those. Instead the
		dark bg + serif font are applied on the public booking page's own wrapper,
		see the "booking-page-layout-wrapper" anchor in src/routes/[slug]/+page.svelte.
	-->
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
